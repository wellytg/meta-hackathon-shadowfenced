# Shadowfenced evaluation corpus: templates only, never secret values.
# Every {{...}} template expands at runtime (see src/shadowfenced/corpus.py).
# Fictional org "Corvane Labs" only: 555 numbers, @corvane.io, 078-05-1120,
# and 4111...1111 are invented test values. No key shape appears literally.
#
# Schema: {id, category, input|file, expect, acceptable, classes,
# sensitive_values}. Beacons expect HOLD (acceptable REDACT); the generic
# entropy token expects HOLD.

