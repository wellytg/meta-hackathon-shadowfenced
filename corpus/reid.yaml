# Re-identification (T30) red-team corpus: fully fictional cases.
# Conventions (match corpus/cases.yaml): YAML list of mappings, invented
# people/places only ("Corvane Labs" setting), phones like 555-01xx,
# emails only *@example.com or *@corvane.io. No real PII anywhere.
#
# Schema per case: {id, category (risky/safe),
# kind (single_turn/multi_turn/residual/indirect/isolated/public_figure/fictional),
# text | messages (+ conversation: true for multi-turn),
# redacted_text + remaining_clues (residual only),
# expected (WARN/HOLD risky, OK safe), combination (risky quasi-identifier
# combo, [] for safe), notes}. public_figure: true marks fictional public
# figures in public roles.
#
# Counts: 40 total = 25 risky (8 single_turn, 7 multi_turn, 5 residual,
# 5 indirect) + 15 safe (6 isolated, 5 public_figure, 4 fictional).

