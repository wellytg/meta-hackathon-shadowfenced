# Person-search intent (T33): fictional cases only.
# Conventions match corpus/reid.yaml: invented people/places ("Corvane Labs"
# setting), phones like 555-01xx, emails only *@example.com or *@corvane.io.
# No real PII anywhere.
#
# Schema per case: {id, category (risky/safe),
# kind (single_turn/multi_turn/historical/public_figure/harmless/fictional),
# text | messages (+ conversation: true for multi_turn),
# expected (WARN risky, OK safe), combination (quasi-identifier combo or
# search cues, [] for harmless), notes}. public_figure: true marks
# fictional public figures in public roles; historical: true marks
# historical figures (never flagged).
#
# Counts: 20 total = 12 risky (private-person searches, expect WARN) +
# 8 safe (public/historical/harmless, expect OK).

