[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowfenced"
version = "0.0.0"
description = "Local layer between any person and any AI: underlines sensitive text and lets only clean or redacted text cross the boundary."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "truststore",
    "pydantic",
    "pyyaml",
    "python-multipart",
    "python-docx",
    "pypdf",
    "keyring",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "playwright",
]
finetune = [
    "transformers",
    "peft",
    "bitsandbytes",
    "datasets",
    "accelerate",
    "trl",
]

[project.scripts]
shadowfenced = "shadowfenced.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
