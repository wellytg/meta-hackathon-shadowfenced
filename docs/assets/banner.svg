<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Shadowfenced banner: laptop sends only placeholders through a shield gate to the cloud.">
  <rect x="0" y="0" width="1280" height="400" fill="#FAF5EA"/>
  <rect x="2" y="2" width="1276" height="396" fill="none" stroke="#17130C" stroke-width="4"/>
  <text x="46" y="60" font-family="monospace" font-size="17" letter-spacing="3" fill="#17130C">LOCAL AI FILTER</text>
  <text x="42" y="136" font-family="Arial Black, Arial, sans-serif" font-size="60" font-weight="900" fill="#17130C">SHADOWFENCED</text>
  <text x="46" y="180" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17130C">Nothing sensitive crosses the boundary.</text>
  <rect x="46" y="200" width="400" height="6" fill="#17130C"/>
  <rect x="46" y="226" width="190" height="48" fill="#2F6F9E" stroke="#17130C" stroke-width="2"/>
